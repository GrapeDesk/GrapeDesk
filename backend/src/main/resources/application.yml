server:
  port: 8080
  error:
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grapedesk}
    username: ${DB_USER:grapedesk}
    password: ${DB_PASSWORD:grapedesk}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
app:
  jwt:
    secret: ${JWT_SECRET:grapedesk-dev-secret-troque-em-producao-0123456789}
    expiration-minutes: 480
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:uploads}
